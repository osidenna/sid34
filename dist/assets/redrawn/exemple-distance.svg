<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 330" width="260" height="268" role="img" aria-labelledby="t"><title id="t">Droite 2x1 + x2 = 0, vecteur w = (2,1), point A = (3,4) du côté positif et sa distance 2√5 à la droite</title>

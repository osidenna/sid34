<g stroke="#efeff1"><path d="M20 10V320M50 10V320M80 10V320M110 10V320M170 10V320M200 10V320M230 10V320M260 10V320M290 10V320"/><path d="M20 10H290M20 40H290M20 70H290M20 100H290M20 130H290M20 160H290M20 220H290M20 250H290M20 280H290M20 310H290"/></g>
<g stroke="#9aa0ab" stroke-width="1.2"><path d="M20 190H296"/><path d="M140 320V6"/></g>

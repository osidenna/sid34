<text x="196" y="178" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#8a4f8c">w = (2, 1)</text>
<circle cx="230" cy="70" r="6" fill="#fff" stroke="#1d2433" stroke-width="2.4"/><circle cx="110" cy="130" r="3.5" fill="#b4532a"/>
<text x="240" y="66" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d2433">A = (3, 4)</text>
<text x="240" y="82" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#2e6b4f">g(A) = 10 &gt; 0</text>
